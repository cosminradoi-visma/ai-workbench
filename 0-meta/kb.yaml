# Workbench configuration, read by the kb-* skills. Flat keys only.
owner: TODO-your-name
language: en

# Limits kb-tidy checks
boot_budget_tokens: 2000    # what loads before your first message: CLAUDE.md + imports + profile
now_max_lines: 40
state_max_lines: 80
stale_days: 14              # NOW.md / state.md older than this gets flagged
skill_description_max: 300  # characters; longer descriptions crowd the skill listing
