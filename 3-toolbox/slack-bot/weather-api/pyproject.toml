[project]
name = "weather-api"
version = "0.1.0"
description = "Forecast API grown from the W2 weather MCP server."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient. is deprecated"]
